[alembic]
script_location = migrations

# Migrations are grouped into per-domain folders under versions/ (core, auth, vault,
# integrations, processing) purely so the folder is browsable. They remain ONE linear
# chain: order comes from each file's down_revision, never from the folder, and
# `alembic history` is the only authority on it. Without the recursive flag Alembic scans
# versions/ one level deep and would silently see zero revisions -- an empty history
# looks exactly like "no migrations to run", which is how a deploy quietly skips them.
recursive_version_locations = true
prepend_sys_path = .
path_separator = os
# DB URL is injected at runtime from app settings (see migrations/env.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
