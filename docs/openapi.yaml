          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddItemsRequest:
      properties:
        item_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 100
          minItems: 1
          title: Item Ids
      type: object
      required:
      - item_ids
      title: AddItemsRequest
    AddItemsResponse:
      properties:
        added:
          type: integer
          title: Added
        skipped:
          type: integer
          title: Skipped
      type: object
      required:
      - added
      - skipped
      title: AddItemsResponse
      description: '`skipped` counts what was already there or was not the caller''s to add.


        Reported rather than raised: re-adding a memory is the normal outcome of "add all

        suggestions", not an error, and the old behaviour -- a primary-key violation surfacing

        as a 500 -- made the obvious user action look like a broken server.'
    Body_save_voice_note_api_v1_vault_voice_post:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        peaks:
          anyOf:
          - type: string
          - type: 'null'
          title: Peaks
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        duration:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration
      type: object
      required:
      - audio
      title: Body_save_voice_note_api_v1_vault_voice_post
    Body_upload_document_api_v1_vault_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_document_api_v1_vault_upload_post
    ContentType:
      type: string
      enum:
      - youtube
      - article
      - pdf
      - document
      - note
      - instagram
      - facebook
      - tiktok
      - linkedin
      - voice
      - image
      title: ContentType
    CreateInviteRequest:
      properties:
        role:
          $ref: '#/components/schemas/SpaceRole'
          default: viewer
      type: object
      title: CreateInviteRequest
    CreateNoteRequest:
      properties:
        title:
          type: string
          maxLength: 512
          minLength: 1
          title: Title
        content:
          type: string
          minLength: 1
          title: Content
      type: object
      required:
      - title
      - content
      title: CreateNoteRequest
    CreateSpaceRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        visibility:
          $ref: '#/components/schemas/Visibility'
          default: private
        emoji:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Emoji
        accent:
          anyOf:
          - type: string
            maxLength: 24
          - type: 'null'
          title: Accent
        item_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 100
          title: Item Ids
      type: object
      required:
      - name
      title: CreateSpaceRequest
    FileLinkResponse:
      properties:
        url:
          type: string
          title: Url
        expires_in:
          type: integer
          title: Expires In
        file_name:
          anyOf:
          - type: string
          - type: 'null'
          title: File Name
        file_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: File Size
        mime_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Type
      type: object
      required:
      - url
      - expires_in
      title: FileLinkResponse
      description: 'A short-lived download URL for an uploaded file.


        Minted per request and never stored. Treat it as a credential: it carries its own

        signature, so anyone holding it can fetch the object until it expires.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InstagramAccountRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        instagram_user_id:
          type: string
          title: Instagram User Id
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        profile_picture_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Picture Url
        page_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Page Name
        token_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Token Expires At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - instagram_user_id
      - username
      - name
      - profile_picture_url
      - page_name
      - token_expires_at
      - created_at
      title: InstagramAccountRead
    InstagramConnectionsResponse:
      properties:
        available:
          type: boolean
          title: Available
        accounts:
          items:
            $ref: '#/components/schemas/InstagramAccountRead'
          type: array
          title: Accounts
      type: object
      required:
      - available
      - accounts
      title: InstagramConnectionsResponse
    InviteResponse:
      properties:
        url:
          type: string
          title: Url
        role:
          $ref: '#/components/schemas/SpaceRole'
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - url
      - role
      - expires_at
      title: InviteResponse
      description: 'The raw token exists only in this response and in the link the user copies.


        Treat it as a credential: anyone holding it can join the Space until it is spent or

        expires. It is never stored -- only its SHA-256 is.'
    OAuthProviderInfo:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
        login_url:
          type: string
          title: Login Url
      type: object
      required:
      - id
      - label
      - login_url
      title: OAuthProviderInfo
    Plan:
      type: string
      enum:
      - free
      - pro
      - team
      title: Plan
    ProcessingStatus:
      type: string
      enum:
      - pending
      - processing
      - completed
      - failed
      - skipped
      title: ProcessingStatus
    ProvidersResponse:
      properties:
        providers:
          items:
            $ref: '#/components/schemas/OAuthProviderInfo'
          type: array
          title: Providers
      type: object
      required:
      - providers
      title: ProvidersResponse
    PublicSpace:
      properties:
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        emoji:
          anyOf:
          - type: string
          - type: 'null'
          title: Emoji
        accent:
          anyOf:
          - type: string
          - type: 'null'
          title: Accent
        ai_overview:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Overview
        items:
          items:
            $ref: '#/components/schemas/VaultItemRead'
          type: array
          title: Items
      type: object
      required:
      - name
      - description
      - emoji
      - accent
      - ai_overview
      - items
      title: PublicSpace
      description: 'The unauthenticated share page.


        Hand-built and narrower than `SpaceRead` on purpose: no id, no slug echo, no

        visibility, no member list, no role. A public page is read by people who are not in

        the Space, and the shape of what it returns is the whole access-control boundary.'
    RefreshResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        expires_in:
          type: integer
          title: Expires In
        refresh_expires_at:
          type: string
          format: date-time
          title: Refresh Expires At
      type: object
      required:
      - expires_in
      - refresh_expires_at
      title: RefreshResponse
      description: 'Answer to POST /auth/refresh. The tokens themselves travel as HttpOnly cookies and

        deliberately never appear in a body -- a body is readable by script, a cookie is not.


        `expires_in` lets the SPA schedule a refresh slightly before the access token dies

        instead of discovering it through a failed request.'
    ReprocessRequest:
      properties:
        language:
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
          title: Language
      type: object
      title: ReprocessRequest
      description: 'Optional knobs on a retry. Only voice notes have one so far.


        `language` is validated against a closed allowlist in `services/transcription.py`

        rather than here: an unknown code means auto-detect, not a rejected request, because

        a client bug must not stand between someone and a fixed transcript.'
    SaveUrlRequest:
      properties:
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      type: object
      required:
      - url
      title: SaveUrlRequest
    SessionRead:
      properties:
