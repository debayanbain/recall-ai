          format: date-time
          title: Expires At
      type: object
      required:
      - id
      - created_at
      - last_used_at
      - expires_at
      title: SessionRead
      description: 'One live device in the user''s own session list.


        Carries no credential: `id` is a row id whose only power is `DELETE /auth/sessions/

        {id}`, and that is ownership-checked.'
