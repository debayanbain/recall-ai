            maxLength: 24
          - type: 'null'
          title: Accent
        pinned:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Pinned
      type: object
      title: UpdateSpaceRequest
      description: 'Every field optional, and every field one a caller is allowed to set.


        `None` means "leave it alone" rather than "clear it", except for `emoji` and `accent`

        where the empty string is the way to clear -- a nullable field with two meanings for

        null is a field nobody can use correctly.'
    UserRead:
