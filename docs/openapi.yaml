      description: A freshly minted, single-use deep link. Shown once and never stored client-side.
    UpdateContentRequest:
      properties:
        blocks:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 500
          title: Blocks
      type: object
      required:
      - blocks
      title: UpdateContentRequest
      description: 'A manual rewrite of an item''s body, as EditorJS blocks.


        Deliberately the *only* thing this endpoint accepts. Taking the whole item and

        copying fields across would let a caller set `ai_category`, `processing_status` or

        `user_id` by adding them to the body; there is nothing here to overpost with.


        The plain text is derived from the blocks server-side rather than sent alongside

        them, so `content` and the stored document can never disagree about what the user

        actually wrote.'
    UpdateSpaceRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
