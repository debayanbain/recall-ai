apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recall-api
  namespace: recallai
  annotations:
    # Which issuer asks for the certificate. Staging first, prod after testing.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Send plain HTTP to HTTPS.
    traefik.ingress.kubernetes.io/router.middlewares: recallai-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - recall-api.debayanbain.in
      secretName: recall-api-tls        # cert-manager writes the certificate here
  rules:
    - host: recall-api.debayanbain.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: recall-api, port: { number: 8000 } } }
          - path: /health
            pathType: Exact
            backend: { service: { name: recall-api, port: { number: 8000 } } }
          - path: /ready
            pathType: Exact
            backend: { service: { name: recall-api, port: { number: 8000 } } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: recallai
spec:
  redirectScheme:
    scheme: https
    permanent: true
