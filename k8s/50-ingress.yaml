apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recall-api
  namespace: recallai
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: recall-api, port: { number: 8000 } } }
          - path: /health
            pathType: Exact
            backend: { service: { name: recall-api, port: { number: 8000 } } }
          - path: /ready
            pathType: Exact
            backend: { service: { name: recall-api, port: { number: 8000 } } }
