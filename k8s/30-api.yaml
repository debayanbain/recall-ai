apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall-api
  namespace: recallai
spec:
  replicas: 1
  selector:
    matchLabels: { app: recall-api }
  template:
    metadata:
      labels: { app: recall-api }
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: api
          image: 179793764711.dkr.ecr.ap-south-1.amazonaws.com/recallai-api:__TAG__
          command: ["uvicorn", "app.main:app", "--host=0.0.0.0", "--port=8000",
                    "--workers=1", "--proxy-headers",
                    "--forwarded-allow-ips=10.42.0.0/16"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: recallai-env }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "400Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recall-api
  namespace: recallai
spec:
  selector: { app: recall-api }
  ports:
    - { port: 8000, targetPort: 8000 }
