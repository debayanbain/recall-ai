apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-__TAG__
  namespace: recallai
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: migrate
          image: 179793764711.dkr.ecr.ap-south-1.amazonaws.com/recallai-api:__TAG__
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: { name: recallai-env }
          resources:
            limits: { memory: "256Mi" }
