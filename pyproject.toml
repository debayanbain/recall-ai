[project]
name = "recall-ai"
version = "0.1.0"
description = "RecallAI - AI-powered memory vault SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "authlib>=1.3",
    "cryptography>=43.0",
    "pyjwt>=2.10",
    "python-slugify>=8.0",
    "structlog>=24.4",
    "boto3>=1.35",
    "itsdangerous>=2.2",
    "tenacity>=9.0",
    "google-genai>=0.3",
    "openai>=3.3.1",
    "celery[redis]>=5.4",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

# Celery ships no type information, so every @celery_app.task is an untyped decorator.
# Scoped to the one module that defines tasks rather than relaxing strict globally.
[[tool.mypy.overrides]]
module = "app.queue.tasks"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped event loop so the session-scoped async engine fixture in
# tests/conftest.py is usable from function-scoped tests; asyncpg connections are
# bound to the loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
