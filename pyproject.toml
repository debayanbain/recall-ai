[project]
name = "recall-ai"
version = "0.1.0"
description = "RecallAI - AI-powered memory vault SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "authlib>=1.3",
    "cryptography>=43.0",
    "pyjwt>=2.10",
    "python-slugify>=8.0",
    "structlog>=24.4",
    "boto3>=1.35",
    "itsdangerous>=2.2",
    "tenacity>=9.0",
    "google-genai>=0.3",
    "openai>=3.3.1",
    # Chat/retrieval only. The enrichment pipeline still goes through AIProvider --
    # LangChain supplies the multi-turn chat model and structured output that the
    # four-method Protocol has no room for. Deliberately NOT langchain-redis or
    # langchain-community: the message history is ~40 lines over the redis client
    # this project already depends on, and both of those pull in a vector-store stack
    # we do not use.
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.1",
    # The tool lane's driver. Taken for exactly one reason: a hand-rolled loop over
    # `ainvoke` cannot stream, because it must inspect a whole turn to know whether it
    # was tool calls or the answer -- so the surface that most needs streaming (a web
    # page, where the reader is watching the spot) was the one surface that could not
    # have the tools. `stream_mode="messages"` solves that and nothing else here does.
    # Checkpointers, interrupts and human-in-the-loop are deliberately unused: this graph
    # answers one question and ends.
    "langgraph>=0.2",
    "celery[redis]>=5.4",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "av>=13.0",
    "youtube-transcript-api>=0.6",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
    # Celery's web UI, started by the dev runners. A dev extra rather than a runtime
    # dependency: nothing in `app/` imports it, and it must not ship with the service --
    # it renders task arguments (Telegram chat ids among them) behind no authentication.
    "flower>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

# Celery ships no type information, so every @celery_app.task is an untyped decorator.
# Scoped to the one module that defines tasks rather than relaxing strict globally.
[[tool.mypy.overrides]]
module = ["app.queue.tasks", "app.queue.celery_app"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped event loop so the session-scoped async engine fixture in
# tests/conftest.py is usable from function-scoped tests; asyncpg connections are
# bound to the loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
